<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Home</title>
<style>
/* Layout: clock top-left over the wallpaper, favourites grid and dock at the bottom; swipe up for a full-screen drawer. */
@font-face { font-family: "Chakra Petch"; font-weight: 700; src: url(fonts/ChakraPetch-Bold.woff2) format("woff2"); }
:root { --bg:#080604; --amber:#FF8A24; --copper:#8F451B; --text:#FFD2A6; --muted:#A08670; --line:#3a2414;
  --display:"Chakra Petch", ui-monospace, monospace; --body:system-ui, sans-serif; color-scheme:dark }
[hidden] { display:none !important }
* { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent }
html, body { height:100%; margin:0; overflow:hidden; background:transparent; color:var(--text); font:13px/1.3 var(--body) }
#home { height:100%; display:flex; flex-direction:column; padding:28px 14px 10px }
.clock { font:700 64px/1 var(--display); color:var(--amber) }
.date { color:var(--text); font-size:15px; margin-top:6px; text-shadow:0 1px 3px #000 }
.spacer { flex:1 }
.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px 6px }
.dock { margin-top:18px; padding-top:12px; border-top:1px solid var(--line) }
.dock .lab { display:none }
.app { display:grid; justify-items:center; gap:5px; background:none; border:0; padding:0; color:inherit; font:inherit; min-height:48px }
.ico { width:60px; height:60px; display:grid; place-items:center }
.ico img { width:100%; height:100% }
.tile { width:60px; height:60px; border:2.2px solid var(--amber); border-radius:18px; background:var(--bg); color:var(--amber);
  display:grid; place-items:center; font:700 26px var(--display) }
.lab { max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-shadow:0 1px 3px #000 }
.handle { align-self:center; width:44px; height:5px; border-radius:3px; background:var(--muted); opacity:.6; margin-top:12px; border:0 }
#drawer { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; padding:16px 14px 0; transform:translateY(100%); transition:transform .22s ease-out }
#drawer.open { transform:none }
#q { width:100%; min-height:48px; border-radius:16px; border:1.5px solid var(--copper); background:transparent; color:var(--text); font:16px var(--body); padding:0 16px; -webkit-user-select:text; user-select:text }
#q::placeholder { color:var(--muted) }
#list { flex:1; min-height:0; overflow-y:auto; padding:18px 0 24px }
#all { align-content:start }
#sheet { position:fixed; left:0; right:0; bottom:0; background:#140d07; border-top:1.5px solid var(--copper); border-radius:24px 24px 0 0; padding:18px 16px 24px; display:grid; gap:8px }
#sheet b { font:700 18px var(--display); color:var(--amber); margin-bottom:4px }
#sheet button { min-height:48px; border-radius:14px; border:1.5px solid var(--copper); background:transparent; color:var(--text); font:600 15px var(--body) }
#scrim { position:fixed; inset:0; background:rgba(0,0,0,.5) }
#toast { position:fixed; left:16px; right:16px; bottom:24px; padding:14px; border-radius:14px; background:var(--text); color:var(--bg); font-weight:600; text-align:center }
@media (prefers-reduced-motion: reduce) { #drawer { transition:none } }
</style>
</head>
<body>
<div id="home">
  <div class="clock" id="clock"></div><div class="date" id="date"></div>
  <div class="spacer"></div>
  <div class="grid" id="fav"></div>
  <div class="grid dock" id="dock"></div>
  <button class="handle" id="handle" aria-label="All apps"></button>
</div>
<div id="drawer" aria-hidden="true"><input id="q" type="search" placeholder="Search apps" autocomplete="off"><div id="list"><div class="grid" id="all"></div></div></div>
<div id="scrim" hidden></div><div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>
<script src="themes.js"></script>
<script>
const theme = (window.THEMES || [])[0], $ = id => document.getElementById(id);
const byPkg = {}; for (const c in theme.links) byPkg[c.split("/")[0]] = theme.links[c];
const DEF_DOCK = ["com.samsung.android.dialer", "com.google.android.apps.messaging", "com.android.chrome", "com.sec.android.app.camera"];
const DEF_FAV = ["com.instagram.android", "com.whatsapp", "com.google.android.youtube", "com.discord"];
let apps = [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d } catch { return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };
let timer; function toast(m) { $("toast").textContent = m; $("toast").hidden = false; clearTimeout(timer); timer = setTimeout(() => $("toast").hidden = true, 2200) }

// Exact activity first; fall back to the package, since apps sometimes rename their start activity in updates.
function icon(comp, label) {
  const r = theme.links[comp] || byPkg[comp.split("/")[0]];
  return r ? `<span class="ico"><img src="file:///android_res/drawable/${r}.png" alt=""></span>`
           : `<span class="tile">${esc((label.match(/[A-Za-z0-9]/) || ["?"])[0].toUpperCase())}</span>`;
}
const cell = a => `<button class="app" data-c="${esc(a[1])}">${icon(a[1], a[0])}<span class="lab">${esc(a[0])}</span></button>`;
const find = c => apps.find(a => a[1] === c);
// Saved slots hold "package/activity"; the first-run defaults hold packages and resolve to whatever activity is installed.
const resolve = list => list.map(x => find(x) || apps.find(a => a[1].split("/")[0] === x)).filter(Boolean);

function render() {
  const fav = resolve(load("fav", DEF_FAV)), dock = resolve(load("dock", DEF_DOCK));
  $("fav").innerHTML = fav.map(cell).join(""); $("dock").innerHTML = dock.map(cell).join("");
  const q = $("q").value.trim().toLowerCase();
  $("all").innerHTML = apps.filter(a => !q || a[0].toLowerCase().includes(q)).map(cell).join("") || `<p style="grid-column:1/-1;color:var(--muted)">No app called "${esc(q)}".</p>`;
}
window.refresh = () => { apps = window.App ? JSON.parse(App.apps()) : []; apps.sort((a, b) => a[0].localeCompare(b[0])); render() };

function tick() { const d = new Date(); $("clock").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
  $("date").textContent = d.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" }) }
tick(); setInterval(tick, 15000); document.addEventListener("visibilitychange", tick);

const drawer = $("drawer");
function openDrawer() { drawer.classList.add("open"); drawer.setAttribute("aria-hidden", "false") }
window.goHome = () => { closeSheet(); drawer.classList.remove("open"); drawer.setAttribute("aria-hidden", "true"); $("q").value = ""; $("q").blur(); render(); $("list").scrollTop = 0 };
$("handle").onclick = openDrawer;
$("q").oninput = render;

// Swipe up on home opens the drawer; swipe down at the top of the drawer closes it.
let y0 = null;
addEventListener("touchstart", e => y0 = e.touches[0].clientY, { passive: true });
addEventListener("touchend", e => { if (y0 === null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null;
  if (!drawer.classList.contains("open") && dy < -60) openDrawer();
  else if (drawer.classList.contains("open") && dy > 90 && $("list").scrollTop <= 0) goHome(); }, { passive: true });

// Tap opens an app; holding it for half a second opens its menu.
let hold, held = false;
addEventListener("pointerdown", e => { const b = e.target.closest(".app"); if (!b) return; held = false;
  hold = setTimeout(() => { held = true; menu(b.dataset.c) }, 480) });
["pointerup", "pointercancel", "pointermove"].forEach(t => addEventListener(t, e => { if (t !== "pointermove" || Math.abs(e.movementY) + Math.abs(e.movementX) > 6) clearTimeout(hold) }));
addEventListener("click", e => { const b = e.target.closest(".app"); if (!b || held) return;
  const r = window.App ? App.launch(b.dataset.c) : "This only works on the phone."; if (r !== "ok") toast(r) });

function menu(c) {
  const a = find(c); if (!a) return;
  const fav = load("fav", null) || resolve(DEF_FAV).map(x => x[1]), dock = load("dock", null) || resolve(DEF_DOCK).map(x => x[1]);
  const opts = [];
  if (fav.includes(c)) opts.push(["Remove from home", () => save("fav", fav.filter(x => x !== c))]);
  else if (fav.length < 12) opts.push(["Add to home", () => save("fav", [...fav, c])]);
  if (dock.includes(c)) opts.push(["Remove from dock", () => save("dock", dock.filter(x => x !== c))]);
  else if (dock.length < 4) opts.push(["Add to dock", () => save("dock", [...dock, c])]);
  opts.push(["App info", () => window.App && App.appInfo(c)]);
  $("sheet").innerHTML = `<b>${esc(a[0])}</b>` + opts.map((o, i) => `<button data-i="${i}">${o[0]}</button>`).join("");
  $("sheet").querySelectorAll("button").forEach(b => b.onclick = () => { opts[b.dataset.i][1](); closeSheet(); render() });
  $("sheet").hidden = $("scrim").hidden = false;
}
function closeSheet() { $("sheet").hidden = $("scrim").hidden = true }
$("scrim").onclick = closeSheet;

refresh();
</script>
</body>
</html>
